name: CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Refresh lock metadata for clean install
        run: npm install --package-lock-only --ignore-scripts
      - run: npm ci
      - name: Syntax checks
        run: |
          node --check server.js
          node --check routes/auth.js
          node --check routes/security.js
          node --check middleware/auth.js
          node --check database/db.js
          node --check public/js/reseller-enhancements.js
      - name: Test suite
        run: npm test -- --runInBand
      - name: Build clean deploy.zip
        run: |
          zip -r deploy.zip . \
            -x '.git/*' \
               '.github/*' \
               'node_modules/*' \
               'data/*' \
               '.env' \
               '.env.*' \
               'coverage/*' \
               '*.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: deploy
          path: deploy.zip
          retention-days: 7
