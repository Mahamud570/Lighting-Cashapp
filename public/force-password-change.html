<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change Password — Lightning Pay</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-primary); position: relative; overflow: hidden; }
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(ellipse at 60% 40%, rgba(99,102,241,0.12) 0%, transparent 50%),
                  radial-gradient(ellipse at 30% 70%, rgba(139,92,246,0.08) 0%, transparent 50%);
      pointer-events: none;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px;
      box-shadow: var(--shadow-lg);
      position: relative;
      z-index: 1;
    }
    .auth-logo { text-align: center; margin-bottom: 28px; }
    .auth-logo .logo-icon { font-size: 40px; display: block; margin-bottom: 8px; }
    .auth-logo h1 { font-size: 24px; font-weight: 800; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .auth-logo p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .error-msg { display: none; margin-bottom: 15px; }
    .btn-auth { width: 100%; padding: 12px; font-size: 15px; margin-top: 10px; }
  </style>
</head>
<body>
<div class="auth-card">
  <div class="auth-logo">
    <span class="logo-icon">🔒</span>
    <h1>Security Update</h1>
    <p>Please change your temporary password to continue</p>
  </div>

  <div class="alert alert-danger error-msg" id="errorMsg"></div>

  <div class="form-group">
    <label class="form-label">Current / Temporary Password</label>
    <input class="form-control" type="password" id="current_password" placeholder="Temporary password" autofocus>
  </div>
  <div class="form-group">
    <label class="form-label">New Password</label>
    <input class="form-control" type="password" id="new_password" placeholder="At least 8 characters">
  </div>
  <div class="form-group">
    <label class="form-label">Confirm New Password</label>
    <input class="form-control" type="password" id="confirm_password" placeholder="Repeat new password">
  </div>

  <button class="btn btn-primary btn-auth" onclick="changePassword()">Update Password</button>
</div>

<script>
async function changePassword() {
  const current_password = document.getElementById('current_password').value;
  const new_password = document.getElementById('new_password').value;
  const confirm_password = document.getElementById('confirm_password').value;
  const errorMsg = document.getElementById('errorMsg');

  errorMsg.style.display = 'none';

  if (!current_password || !new_password || !confirm_password) {
    errorMsg.innerText = 'All fields are required';
    errorMsg.style.display = 'block';
    return;
  }

  try {
    const res = await fetch('/api/security/password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ current_password, new_password, confirm_password })
    });

    const data = await res.json();
    if (!res.ok) {
      errorMsg.innerText = data.error || 'Failed to update password';
      errorMsg.style.display = 'block';
      return;
    }

    // Redirect to home root so role-based routing kicks in
    window.location.href = '/';
  } catch (err) {
    errorMsg.innerText = 'Network error. Please try again.';
    errorMsg.style.display = 'block';
  }
}
</script>
</body>
</html>
